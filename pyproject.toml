[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "judge-align"
version = "0.1.0"
description = "Source-backed, resumable judge alignment experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
qwen = ["torch==2.8.0", "transformers==4.57.1", "accelerate==1.11.0", "bitsandbytes==0.48.2"]

[project.scripts]
judge-align = "judge_align.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
